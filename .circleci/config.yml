version: 2.1

# Migrated from GitHub Actions (.github/workflows/ci.yml,
# .github/workflows/docker-publish.yml -- kept in the repo but triggers
# disabled, see those files). .github/workflows/docs.yml (Helm chart ->
# GitHub Pages) stays on GitHub Actions unchanged: actions/deploy-pages has
# no CircleCI equivalent, and it's unrelated to the CI/release gate this
# migration targets.
#
# Differences from the GitHub Actions version worth knowing:
# - No native path-filtering (GH Actions' `paths: [...]`) -- every job runs
#   on every push to main/develop and every PR, not just when web/** or Go
#   files change. Add the circleci/path-filtering orb later if the extra CI
#   minutes become a real cost.
# - go-integration uses a native CircleCI secondary container
#   (postgres:16-alpine) instead of GH Actions' `docker run` step -- same
#   effect (disposable Postgres on localhost:5432, max_connections=300 per
#   AGENTS.md SS3), simpler than reaching for setup_remote_docker for a job
#   that doesn't otherwise need a real Docker daemon.
# - release needs real Docker (multi-arch buildx) and the `gh` CLI, so it
#   runs on a machine executor and installs both by hand -- no
#   docker/setup-qemu-action or softprops/action-gh-release equivalent.
# - GitHub Actions' automatic `secrets.GITHUB_TOKEN` has no CircleCI
#   equivalent -- release needs 2 project env vars instead:
#     - GHCR_USER / GHCR_TOKEN: GitHub PAT (classic, scopes write:packages,
#       read:packages) to push the image to ghcr.io.
#     - GH_TOKEN: GitHub PAT (classic, scope public_repo -- this repo is
#       public) so the `gh` CLI can create the GitHub Release and upload
#       the Helm chart .tgz to it.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  go-with-postgres:
    docker:
      - image: cimg/go:1.26
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: vane
          POSTGRES_PASSWORD: vane
          POSTGRES_DB: vane
        command: ["-c", "max_connections=300"]
  node:
    docker:
      - image: cimg/node:22.11
    resource_class: medium

jobs:
  go-gate:
    executor: go
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Download modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
      - run:
          name: gofmt
          command: |
            fmt_out="$(gofmt -l .)"
            if [ -n "$fmt_out" ]; then
              echo "gofmt found unformatted files:"
              echo "$fmt_out"
              exit 1
            fi
      - run:
          name: Vet
          command: go vet ./...
      - run:
          name: Unit tests
          command: go test ./...

  web-gate:
    executor: node
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "web/package-lock.json" }}
            - npm-cache-v1-
      - run:
          name: Install dependencies
          command: cd web && npm ci
      - save_cache:
          key: npm-cache-v1-{{ checksum "web/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck
          command: cd web && npx tsc -b --noEmit
      - run:
          name: Test
          command: cd web && npm run test
      - run:
          name: i18n key parity
          command: cd web && npm run i18n:check
      - run:
          name: Build
          command: cd web && npm run build

  go-integration:
    executor: go-with-postgres
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Download modules
          command: go mod download
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
      # internal/cli's admin-router tests assert on the real embedded
      # web/dist (SPA fallback serves index.html) - without a real build
      # here, web/dist only has the go:embed placeholder (.gitkeep) and
      # that assertion fails deterministically, not flakily.
      - run:
          name: Build frontend
          command: cd web && npm ci && npm run build
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0
              sleep 1
            done
            echo "Postgres never became reachable on localhost:5432" >&2
            exit 1
      # -p 1 serializes package test binaries. Every package shares this one
      # database and several mutate the same singleton/shared tables (users,
      # status_intervals, integrations), so parallel binaries race each
      # other (AGENTS.md SS3).
      - run:
          name: Run integration tests
          environment:
            TEST_DATABASE_URL: "postgres://vane:vane@localhost:5432/vane?sslmode=disable"
          command: go test -tags=integration -p 1 ./...

  full-build:
    executor: go
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - run:
          name: Full build (front embedded in Go binary)
          command: make build

  release:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Fetch full history (helm/gh need tags and full checkout)
          command: git fetch --unshallow --tags || git fetch --tags
      - run:
          name: Install QEMU for multi-arch build
          command: docker run --rm --privileged tonistiigi/binfmt --install all
      - run:
          name: Create buildx builder
          command: docker buildx create --use
      - run:
          name: Log in to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Resolve version from tag
          command: |
            VERSION="${CIRCLE_TAG#v}"
            MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
            {
              echo "export IMAGE_VERSION=$VERSION"
              echo "export IMAGE_TAG_VER=ghcr.io/zeeplabs/zeep-vane:$VERSION"
              echo "export IMAGE_TAG_MINOR=ghcr.io/zeeplabs/zeep-vane:$MAJOR_MINOR"
            } >> "$BASH_ENV"
      - run:
          name: Build and push (multi-arch)
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE_TAG_VER" \
              --tag "$IMAGE_TAG_MINOR" \
              --push \
              .
      - run:
          name: Install Helm
          command: |
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            chmod 700 get_helm.sh
            ./get_helm.sh
      - run:
          name: Package Helm chart
          command: |
            mkdir -p .helm-packages
            helm package charts/zeep-vane --version "$IMAGE_VERSION" --app-version "$IMAGE_VERSION" --destination .helm-packages
      - run:
          name: Prepare release body
          command: |
            NOTES_FILE=".github/release-notes-${CIRCLE_TAG}.md"
            OUT="release-body.md"

            if [ -f "$NOTES_FILE" ]; then
              cp "$NOTES_FILE" "$OUT"
              echo "export RELEASE_NOTES_FOUND=true" >> "$BASH_ENV"
            else
              echo "WARNING: ${NOTES_FILE} not found - falling back to gh's auto-generated notes. See RELEASE.md step 4." >&2
              > "$OUT"
              echo "export RELEASE_NOTES_FOUND=false" >> "$BASH_ENV"
            fi

            {
              echo ""
              echo "## Docker image"
              echo ""
              echo '```bash'
              echo "docker pull ghcr.io/zeeplabs/zeep-vane:${IMAGE_VERSION}"
              echo '```'
              echo ""
              echo "## Helm chart"
              echo ""
              echo '```bash'
              echo "helm repo add zeeplabs https://zeeplabs.github.io/zeep-vane/helm"
              echo "helm install zeep-vane zeeplabs/zeep-vane"
              echo '```'
            } >> "$OUT"
      - run:
          name: Install gh CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
      - run:
          name: Create GitHub Release
          command: |
            if [ "$RELEASE_NOTES_FOUND" = "true" ]; then
              gh release create "$CIRCLE_TAG" .helm-packages/*.tgz \
                --repo zeeplabs/zeep-vane \
                --title "$CIRCLE_TAG" \
                --notes-file release-body.md
            else
              gh release create "$CIRCLE_TAG" .helm-packages/*.tgz \
                --repo zeeplabs/zeep-vane \
                --title "$CIRCLE_TAG" \
                --notes-file release-body.md \
                --generate-notes
            fi

workflows:
  version: 2

  ci:
    jobs:
      - go-gate
      - web-gate
      - go-integration
      - full-build:
          requires:
            - go-gate
            - go-integration
            - web-gate

  release:
    jobs:
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
