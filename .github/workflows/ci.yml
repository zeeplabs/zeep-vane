name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

env:
  GO_VERSION: "1.26.5"

jobs:
  go:
    name: Go (vet, fmt, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  go-integration:
    name: Go (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # internal/cli's admin-router tests assert on the real embedded
      # web/dist (SPA fallback serves index.html) - without a real build
      # here, web/dist only has the go:embed placeholder (.gitkeep) and
      # that assertion fails deterministically, not flakily.
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      # Run Postgres via `docker run` instead of GitHub Actions' `services:`
      # block: `services:` only accepts docker-create flags (`options:`),
      # not arguments to the postgres process itself, so max_connections
      # can't be raised that way. AGENTS.md's own disposable-container gate
      # already uses max_connections=300 for exactly this reason - the
      # default 100 is exceeded by this suite's dedicated (non-pooled)
      # internal/dbtest advisory-lock connections opened across many
      # packages/tests, a documented pre-existing flake (README Known
      # gaps) that -p 1 alone did not fix (the pressure is within a single
      # large package, internal/api, not just across packages).
      - name: Start disposable Postgres
        run: |
          docker run -d --name vane-ci-pg -p 5432:5432 \
            -e POSTGRES_USER=vane -e POSTGRES_PASSWORD=vane -e POSTGRES_DB=vane \
            postgres:16-alpine -c max_connections=300
          for i in $(seq 1 30); do
            docker exec vane-ci-pg pg_isready -U vane && break
            sleep 1
          done
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: "postgres://vane:vane@localhost:5432/vane?sslmode=disable"
        run: go test -tags=integration ./...
      - name: Stop disposable Postgres
        if: always()
        run: docker rm -f vane-ci-pg

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run test
      - run: npm run build

  build:
    name: Full build (front embedded in Go binary)
    runs-on: ubuntu-latest
    needs: [go, go-integration, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
