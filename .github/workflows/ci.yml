name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

env:
  GO_VERSION: "1.26.5"

jobs:
  go:
    name: Go (vet, fmt, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  go-integration:
    name: Go (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # internal/cli's admin-router tests assert on the real embedded
      # web/dist (SPA fallback serves index.html) - without a real build
      # here, web/dist only has the go:embed placeholder (.gitkeep) and
      # that assertion fails deterministically, not flakily.
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      # Run Postgres via `docker run` instead of GitHub Actions' `services:`
      # block: `services:` only accepts docker-create flags (`options:`),
      # not arguments to the postgres process itself, so max_connections
      # can't be raised that way. max_connections=300 matches AGENTS.md's
      # disposable-container gate - this suite's dedicated (non-pooled)
      # internal/dbtest advisory-lock connections are connection-heavy.
      - name: Start disposable Postgres
        run: |
          docker run -d --name vane-ci-pg -p 5432:5432 \
            -e POSTGRES_USER=vane -e POSTGRES_PASSWORD=vane -e POSTGRES_DB=vane \
            postgres:16-alpine -c max_connections=300
          for i in $(seq 1 30); do
            docker exec vane-ci-pg pg_isready -U vane && break
            sleep 1
          done
      # -p 1 serializes package test binaries. Every package shares this one
      # database and several mutate the same singleton/shared tables (users,
      # status_intervals, integrations), so parallel binaries race each
      # other. The migration *_DownReversesCleanly tests also used to step
      # the latest migration (now 0031_sessions) down on this shared
      # database - dropping `sessions` out from under parallel auth tests -
      # and now run on their own scratch database instead.
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: "postgres://vane:vane@localhost:5432/vane?sslmode=disable"
        run: go test -tags=integration -p 1 ./...
      - name: Stop disposable Postgres
        if: always()
        run: docker rm -f vane-ci-pg

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run test
      - run: npm run build

  build:
    name: Full build (front embedded in Go binary)
    runs-on: ubuntu-latest
    needs: [go, go-integration, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
