apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zeep-vane.fullname" . }}
  labels:
    {{- include "zeep-vane.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  VANE_MASTER_KEY: {{ required "secrets.vaneMasterKey is required" .Values.secrets.vaneMasterKey | quote }}
  VANE_SESSION_SECRET: {{ required "secrets.vaneSessionSecret is required" .Values.secrets.vaneSessionSecret | quote }}
