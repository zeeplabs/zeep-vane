services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "443:443"
    environment:
      DATABASE_URL: postgres://vane:vane@db:5432/vane?sslmode=disable
      VANE_MASTER_KEY: ${VANE_MASTER_KEY:?set VANE_MASTER_KEY in .env - see README's Docker Compose section, e.g. openssl rand -hex 32}
      VANE_SESSION_SECRET: ${VANE_SESSION_SECRET:?set VANE_SESSION_SECRET in .env - see README's Docker Compose section, e.g. openssl rand -hex 32}
      PORT: 8080
      POLL_INTERVAL_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # No shell/curl/wget in this image (FROM scratch) - `vane healthcheck`
      # is a Go subcommand that GETs its own /healthz.
      test: ["CMD", "/vane", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vane
      POSTGRES_PASSWORD: vane
      POSTGRES_DB: vane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vane"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
